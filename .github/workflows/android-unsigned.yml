name: Android Unsigned Build

# Builds an unsigned debug/release APK for Nova via Expo prebuild + Gradle.
# This mirrors the exact steps documented in UNSIGNED_BUILD_REPORT.md that
# failed in the Linux sandbox (Gradle plugin resolution) — running them here
# on GitHub's hosted Ubuntu runner (with full network + Android SDK/NDK
# preinstalled via the android-actions/setup-android action) is expected to
# succeed where the offline/restricted sandbox could not.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'app.json'
      - '.github/workflows/android-unsigned.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-android-unsigned-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error
