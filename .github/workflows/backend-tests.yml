name: Backend Tests

# Runs the server-side Vitest suite (tool registry, security fixes, SSRF guard)
# plus a TypeScript check on every push to main and on pull requests touching
# the server.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run tests
